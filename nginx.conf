# /etc/nginx/sites-available/miaucorp.de
# Enable: ln -s /etc/nginx/sites-available/miaucorp.de /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name miaucorp.de www.miaucorp.de miaucorp.com www.miaucorp.com;

    # Redirect all HTTP to HTTPS (after SSL is set up)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5199;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}

